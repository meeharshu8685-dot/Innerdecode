<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innerdecode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Theme script to prevent flash
    // White theme is primary - default to light theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
      // Ensure light theme (white theme) is set as primary if no theme is saved
      if (!savedTheme) {
        localStorage.setItem('theme', 'light');
      }
    }

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'calm-blue': '#60A5FA', // blue-400
            'calm-blue-dark': '#2563EB', // blue-600 - slightly darker for better contrast
            'calm-blue-light': '#EFF6FF', // blue-50
            'calm-green': '#A7F3D0', // emerald-200
            'calm-green-dark': '#059669', // emerald-600
            'calm-lavender': '#F8FAFC', // slate-50 - very subtle cool white
            'light-blue': '#E0F2FE', // sky-100
            'light-olive-green': '#ECFCCB', // lime-100
            'light-cream': '#FAFAF9', // stone-50
            'light-violet': '#F3E8FF', // purple-100
            'text-primary': '#0F172A', // slate-900 - sharper text
            'text-secondary': '#475569', // slate-600
            'premium-gold': '#D4AF37', // Gold for premium accents
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.5s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
          },
        },
      },
    }
  </script>
  <style>
    @media print {
      body {
        background: white !important;
      }
      header, footer, .print-hide {
        display: none !important;
      }
      main {
        padding: 0 !important;
        margin: 1in !important;
      }
      .dark, .dark body {
        background: white !important;
        color: black !important;
      }
      h1, h2, h3, p, li, span {
        color: black !important;
      }
      .print-container {
        box-shadow: none !important;
        padding: 0 !important;
        border: none !important;
      }
      .accordion-content {
        display: block !important;
        visibility: visible !important;
        padding: 1rem 0 !important;
      }
      .accordion-toggle-icon {
        display: none !important;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6"
  }
}
</script>
</head>
<body class="bg-slate-50 dark:bg-black font-sans">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
